{% extends "accounts/base_household.html" %}
{% block title %}临停申请 - 邻里圈{% endblock %}
{% block household_content %}
<h2>临停申请</h2>
<p class="admin-toolbar"><a href="{% url 'vehicle_mgmt:household_temp_request_list' %}">← 申请列表</a></p>
<form method="post" action="">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">提交申请</button>
</form>
<p style="color:#7f8c8d; font-size:0.9em; margin-top:0.5rem;">提交后物业将审批，通过后可按规定时段临时停车。</p>
{% endblock household_content %}

{% extends "accounts/base_admin.html" %}
{% block title %}录入缴费 - 财务管理{% endblock %}
{% block admin_content %}
<h2>录入缴费</h2>
<p class="admin-toolbar"><a href="{% url 'property_fees:admin_payment_list' %}">← 缴费记录</a></p>
<form method="post" action="">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">保存</button>
</form>
<p style="color:#7f8c8d; font-size:0.9em; margin-top:0.5rem;">选择账单后填写缴费金额与支付方式，保存后将自动更新该账单的已缴金额与状态。</p>
{% endblock admin_content %}

{% extends "base.html" %}
{% block title %}物品报失{% endblock %}
{% block content %}
<h2>物品报失</h2>
<p><a href="{% url 'community_core:household_lost_report_list' %}">返回报失列表</a></p>
<form method="post" action="">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">提交报失</button>
</form>
<p class="text-muted" style="font-size:0.9em;">提交后物业会协助留意，如有找到将联系您。</p>
{% endblock %}

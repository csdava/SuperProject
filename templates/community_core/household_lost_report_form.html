{% extends "accounts/base_household.html" %}
{% block title %}物品报失 - 邻里圈{% endblock %}
{% block household_content %}
<h2>物品报失</h2>
<p class="admin-toolbar"><a href="{% url 'community_core:household_lost_report_list' %}">← 报失列表</a></p>
<form method="post" action="">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">提交报失</button>
</form>
<p style="color:#7f8c8d; font-size:0.9em; margin-top:0.5rem;">提交后物业会协助留意，如有找到将联系您。</p>
{% endblock household_content %}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邻里圈</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            cursor: pointer;
            font-family: 'Noto Serif SC', 'Georgia', serif;
        }

        .page {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,
                #faf8ff 0%, #f5f0ff 25%, #fff5f8 50%, #f0f8ff 75%, #faf5ff 100%);
            background-size: 400% 400%;
            animation: gradientFlow 18s ease infinite;
        }

        @keyframes gradientFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* 微光粒子 */
        .particles { position: absolute; inset: 0; pointer-events: none; }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(200,180,220,0.4) 40%, transparent 70%);
            animation: particleFloat 12s ease-in-out infinite;
        }
        .particle:nth-child(1) { left: 15%; top: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 85%; top: 25%; animation-delay: -2s; }
        .particle:nth-child(3) { left: 70%; top: 70%; animation-delay: -4s; }
        .particle:nth-child(4) { left: 20%; top: 75%; animation-delay: -1s; }
        .particle:nth-child(5) { left: 50%; top: 15%; animation-delay: -3s; }
        .particle:nth-child(6) { left: 35%; top: 85%; animation-delay: -5s; }
        @keyframes particleFloat {
            0%, 100% { transform: translate(0,0) scale(1); opacity: 0.6; }
            50% { transform: translate(10px,-10px) scale(1.2); opacity: 1; }
        }

        /* 柔和光晕 */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: orbBreathe 8s ease-in-out infinite;
        }
        .glow-orb.a { width: 280px; height: 280px; background: radial-gradient(circle, rgba(220,180,255,0.5) 0%, transparent 70%); top: 10%; left: 15%; }
        .glow-orb.b { width: 220px; height: 220px; background: radial-gradient(circle, rgba(255,200,220,0.5) 0%, transparent 70%); bottom: 20%; right: 10%; animation-delay: -3s; }
        @keyframes orbBreathe {
            0%, 100% { transform: scale(1); opacity: 0.25; }
            50% { transform: scale(1.12); opacity: 0.4; }
        }

        /* 主标题：居中、不旋转 */
        .title-wrap {
            position: relative;
            z-index: 2;
            animation: titleFloat 5s ease-in-out infinite;
        }
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .brand {
            font-size: clamp(3rem, 12vw, 6.5rem);
            font-weight: 600;
            letter-spacing: 0.35em;
            color: transparent;
            background: linear-gradient(120deg, #8b7aa8 0%, #c9a8d4 25%, #e8b4b8 50%, #c9a8d4 75%, #8b7aa8 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 6s linear infinite, titleScale 4s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(201, 168, 212, 0.5), 0 0 80px rgba(235, 180, 184, 0.3);
            filter: drop-shadow(0 0 30px rgba(201, 168, 212, 0.4));
        }
        @keyframes shimmer { to { background-position: 200% center; } }
        @keyframes titleScale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* 底部提示 */
        .hint {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            color: rgba(139, 122, 168, 0.7);
            animation: hintPulse 2.5s ease-in-out infinite;
            z-index: 2;
        }
        @keyframes hintPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="page" id="landing">
        <div class="particles">
            <span class="particle"></span><span class="particle"></span><span class="particle"></span>
            <span class="particle"></span><span class="particle"></span><span class="particle"></span>
        </div>
        <div class="glow-orb a"></div>
        <div class="glow-orb b"></div>

        <div class="title-wrap">
            <h1 class="brand">邻里圈</h1>
        </div>
        <p class="hint">点击任意处进入</p>
    </div>

    <script>
        document.getElementById('landing').addEventListener('click', function () {
            window.location.href = '{% url "accounts:login_select_role" %}';
        });
    </script>
</body>
</html>

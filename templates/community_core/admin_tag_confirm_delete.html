{% extends "accounts/base_admin.html" %}
{% block title %}删除标签 - 住户管理{% endblock %}
{% block admin_content %}
<h2>确认删除标签</h2>
<p>确定要删除标签「{{ tag.name }}」吗？</p>
<form method="post" action="">

  <button type="submit">确认删除</button>
  <a href="{% url 'community_core:admin_tag_list' %}">取消</a>
</form>
{% endblock admin_content %}

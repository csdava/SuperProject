{% extends "base.html" %}
{% block title %}社区活动{% endblock %}
{% block content %}
<h2>社区活动</h2>
<p><a href="{% url 'accounts:dashboard_household' %}">返回工作台</a></p>
<table class="simple-table">
  <thead>
    <tr><th>活动</th><th>时间</th><th>地点</th><th>操作</th></tr>
  </thead>
  <tbody>
    {% for a in activities %}
    <tr>
      <td>{{ a.title }}</td>
      <td>{{ a.start_time|date:"m-d H:i" }} 至 {{ a.end_time|date:"m-d H:i" }}</td>
      <td>{{ a.location|default:"-" }}</td>
      <td><a href="{% url 'community_core:household_activity_detail' a.pk %}">查看 / 报名</a></td>
    </tr>
    {% empty %}
    <tr><td colspan="4">暂无进行中的活动。</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

{% extends "base.html" %}
{% block title %}{% if is_edit %}编辑活动{% else %}发布活动{% endif %}{% endblock %}
{% block content %}
<h2>{% if is_edit %}编辑活动{% else %}发布活动{% endif %}</h2>
<p>
  <a href="{% url 'community_core:admin_activity_list' %}">返回活动列表</a>
  {% if is_edit and activity %}| <a href="{% url 'community_core:admin_activity_detail' activity.pk %}">活动详情</a>{% endif %}
</p>
<form method="post" action="">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">保存</button>
</form>
{% endblock %}

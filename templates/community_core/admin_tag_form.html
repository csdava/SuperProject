{% extends "base.html" %}
{% block title %}{% if is_edit %}编辑标签{% else %}新增标签{% endif %}{% endblock %}
{% block content %}
<h2>{% if is_edit %}编辑标签{% else %}新增标签{% endif %}</h2>
<p><a href="{% url 'community_core:admin_tag_list' %}">返回标签列表</a></p>
<form method="post" action="">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">保存</button>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}楼栋单元管理 - 管理员{% endblock %}
{% block content %}
<h2>楼栋单元管理</h2>
<p>
  <a href="{% url 'accounts:dashboard_admin' %}">返回工作台</a>
  |
  <a href="{% url 'community_core:admin_building_create' %}">新增楼栋</a>
</p>

<table class="simple-table">
  <thead>
    <tr>
      <th>楼栋名称</th>
      <th>楼栋编号</th>
      <th>地址</th>
      <th>单元数</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody>
    {% for b in buildings %}
    <tr>
      <td>{{ b.name }}</td>
      <td>{{ b.code }}</td>
      <td>{{ b.address|default:"-" }}</td>
      <td>{{ b.units.count }}</td>
      <td>
        <a href="{% url 'community_core:admin_building_detail' b.pk %}">查看/添加单元</a>
        |
        <a href="{% url 'community_core:admin_building_edit' b.pk %}">编辑</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="5">暂无楼栋，请先<a href="{% url 'community_core:admin_building_create' %}">新增楼栋</a>。</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

{% extends "base.html" %}
{% block title %}取消邀请{% endblock %}
{% block content %}
<h2>确认取消邀请</h2>
<p>确定要取消对「{{ invite.visitor_name }}」的访客邀请吗？取消后该邀请码将失效。</p>
<form method="post" action="">
  {% csrf_token %}
  <button type="submit">确认取消</button>
  <a href="{% url 'visitor_access:household_invite_list' %}">返回</a>
</form>
{% endblock %}

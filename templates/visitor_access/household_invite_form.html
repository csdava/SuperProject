{% extends "accounts/base_household.html" %}
{% block title %}邀请访客 - 邻里圈{% endblock %}
{% block household_content %}
<h2>邀请访客</h2>
<p class="admin-toolbar"><a href="{% url 'visitor_access:household_invite_list' %}">← 访客记录</a></p>
<form method="post" action="">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">创建邀请</button>
</form>
<p style="color:#7f8c8d; font-size:0.9em; margin-top:0.5rem;">创建后可将邀请链接或邀请码发给访客，访客在有效期内凭链接/码到门岗核验通行。</p>
{% endblock household_content %}
